<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/plugins/fontawesome/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <title>Styles Store SV</title>
</head>

<body>
    <header class="header">
        <div class="header-content container">
            <nav class="navigation">
                <a href="/">
                    <p class="logotipo">Amor<span>Eterno</span></p>
                </a>

                <div class="btn-cart">
                    <button type="button"><i class="fa-solid fa-cart-shopping icon-cart"></i></button>
                    <span id="cartCount">0</span>

                    <div class="cart">
                        <div class="cart-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Image</th>
                                        <th>Description</th>
                                        <th>Price</th>
                                        <th>Quantity</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="contentProducts">
                                    <tr>
                                        <td><img src="/img/products/product-01.jpg" alt=""></td>
                                        <td>
                                            Lorem ipsum dolor sit.
                                        </td>
                                        <td>$15</td>
                                        <td>
                                            <input type="number" min="1">
                                        </td>
                                        <td>
                                            <button type="button">X</button>
                                        </td>
                                    </tr>
                                </tbody>

                                <tfoot>
                                    <tr>
                                        <td colspan="5" class="total">
                                            <h4 class="heading-total">Total: <span id="total"></span></h4>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td colspan="5">
                                            <button type="button" id="emptyCart">Empty Cart</button>
                                        </td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>

                </div>



            </nav>
        </div>
        <!--
        <form class="form-header">
            <input type="search" name="search" placeholder="Search...">
            <button type="submit"><i class="fa-solid fa-magnifying-glass icon-glass"></i></button>
        </form>
        -->
    </header>

    <section class="banner">
        <div class="banner-grid container">
            
        </div>
    </section>
    <main class="container mt-5">
        <section class="products" id="listProducts">
             <h2 class="text-center mb-4">Nuestros Productos</h2>
           
           <div class="row g-4" id="products-container">
            
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="footer-page"></p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script src="/assets/plugins/fontawesome/js/all.min.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>

</html>
